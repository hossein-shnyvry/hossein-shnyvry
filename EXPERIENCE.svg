<svg fill="none" width="850" height="520" viewBox="0 0 850 520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .sec-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 20px; fill: #FFFFFF; letter-spacing: 1.5px; }
    .year { font-family: system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 22px; fill: #FFFFFF; }
    .month-bg { fill: #D69E2E; rx: 2px; }
    .month-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 9.5px; fill: #000000; letter-spacing: 0.8px; }
    
    .job-title { font-family: system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 17px; fill: #FFFFFF; }
    .company { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 13px; fill: #8B949E; }
    .job-desc { font-family: system-ui, -apple-system, sans-serif; font-weight: 400; font-size: 12.5px; fill: #C9D1D9; }
  </style>

  <!-- Header with Larger Building Icon -->
  <g transform="translate(10, 15)">
    <path transform="translate(0, -3) scale(1.25)" fill="#D69E2E" d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16h14zM9 5h6v2H9V5zm0 4h6v2H9V9zm0 4h6v2H9v-2zm0 4h2v4H9v-4zm4 0h2v4h-2v-4z"/>
    <text x="38" y="17" class="sec-title">WORK EXPERIENCE</text>
    <line x1="0" y1="35" x2="830" y2="35" stroke="#21262D" stroke-width="1"/>
  </g>

  <!-- ITEM 1 -->
  <g transform="translate(10, 75)">
    <path d="M 40 12 L 15 12 L 15 78 L 40 78" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="50" y="18" class="year">2024</text>
    <rect x="50" y="24" width="65" height="15" class="month-bg"/>
    <text x="82.5" y="35" text-anchor="middle" class="month-text">MAY</text>

    <text x="50" y="72" class="year">2023</text>
    <rect x="50" y="78" width="65" height="15" class="month-bg"/>
    <text x="82.5" y="89" text-anchor="middle" class="month-text">OCTOBER</text>

    <text x="140" y="18" class="job-title">Online Supermarket Platform</text>
    <text x="140" y="38" class="company">inOffice.ir / E-Commerce Platform</text>
    <text x="140" y="66" class="job-desc">Designed and developed a smart e-grocery platform for seamless daily shopping.</text>
    <text x="140" y="86" class="job-desc">Features include shopper couriers, local store routing, fast delivery, and real-time tracking.</text>
  </g>

  <!-- ITEM 2 -->
  <g transform="translate(10, 195)">
    <path d="M 40 12 L 15 12 L 15 78 L 40 78" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="50" y="18" class="year">2023</text>
    <rect x="50" y="24" width="75" height="15" class="month-bg"/>
    <text x="87.5" y="35" text-anchor="middle" class="month-text">SEPTEMBER</text>

    <text x="50" y="72" class="year">2022</text>
    <rect x="50" y="78" width="75" height="15" class="month-bg"/>
    <text x="87.5" y="89" text-anchor="middle" class="month-text">DECEMBER</text>

    <text x="140" y="18" class="job-title">ARI Smart Fitness Trainer</text>
    <text x="140" y="38" class="company">inOffice.ir / AI Fitness &amp; Motion Tracking</text>
    <text x="140" y="66" class="job-desc">Engineered an AI-powered motion tracking system processing 30+ body joints.</text>
    <text x="140" y="86" class="job-desc">Provides real-time posture feedback and personalized workout plans without extra hardware.</text>
  </g>

  <!-- ITEM 3 -->
  <g transform="translate(10, 315)">
    <path d="M 40 12 L 15 12 L 15 78 L 40 78" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="50" y="18" class="year">2022</text>
    <rect x="50" y="24" width="75" height="15" class="month-bg"/>
    <text x="87.5" y="35" text-anchor="middle" class="month-text">NOVEMBER</text>

    <text x="50" y="72" class="year">2021</text>
    <rect x="50" y="78" width="75" height="15" class="month-bg"/>
    <text x="87.5" y="89" text-anchor="middle" class="month-text">AUGUST</text>

    <text x="140" y="18" class="job-title">RahKhooneh Real Estate Platform</text>
    <text x="140" y="38" class="company">inOffice.ir / Real Estate Platform</text>
    <text x="140" y="66" class="job-desc">Architected an end-to-end housing portal featuring map-based property search,</text>
    <text x="140" y="86" class="job-desc">free listing registration, agency directories, online insurance, and public services.</text>
  </g>

  <!-- ITEM 4 -->
  <g transform="translate(10, 435)">
    <path d="M 40 12 L 15 12 L 15 78 L 40 78" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="50" y="18" class="year">2021</text>
    <rect x="50" y="24" width="65" height="15" class="month-bg"/>
    <text x="82.5" y="35" text-anchor="middle" class="month-text">JULY</text>

    <text x="50" y="72" class="year">2020</text>
    <rect x="50" y="78" width="65" height="15" class="month-bg"/>
    <text x="82.5" y="89" text-anchor="middle" class="month-text">JANUARY</text>

    <text x="140" y="18" class="job-title">Strategic Empire: Persian Legacy</text>
    <text x="140" y="38" class="company">inOffice.ir / Game Development</text>
    <text x="140" y="66" class="job-desc">Developed a historical strategy game based on ancient Persia with dynamic territory maps,</text>
    <text x="140" y="86" class="job-desc">interactive diplomacy mechanics, Silk Road trade routes, and city management.</text>
  </g>
</svg>
