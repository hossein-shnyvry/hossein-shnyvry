<svg fill="none" width="980" height="175" viewBox="0 0 980 175" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* استایل‌های تم تاریک (پیش‌فرض گیت‌هاب) */
    .section-title { font: 800 18px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #FFFFFF; letter-spacing: 1.5px; text-transform: uppercase; }
    .box { stroke: #30363D; stroke-width: 2; fill: none; }
    .abbr { font: 800 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .label { font: 700 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #C9D1D9; text-anchor: middle; }
    .star-filled { fill: #D69E2E; font-size: 11px; }
    .star-empty { fill: #30363D; font-size: 11px; }
    .bg-gap { fill: #0D1117; } /* پوشش برای بریدگی پایین کادر */
    .accent-icon { fill: #D69E2E; }

    /* تنظیمات خودکار برای تم روشن (Light Mode) */
    @media (prefers-color-scheme: light) {
      .section-title { fill: #1F2328; }
      .box { stroke: #D0D7DE; }
      .abbr { fill: #1F2328; }
      .label { fill: #24292F; }
      .star-empty { fill: #D0D7DE; }
      .bg-gap { fill: #FFFFFF; }
    }
  </style>

  <!-- ۱. هدر بخش (عنوان + آیکون هماهنگ با بنر) -->
  <g transform="translate(15, 25)">
    <!-- آیکون وکتور جعبه ابزار (طلايي) -->
    <path class="accent-icon" d="M17 5h-3V3c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v2H3c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zM8 3h4v2H8V3zm9 14H3V7h14v10z" transform="scale(1.1)"/>
    <!-- متن عنوان -->
