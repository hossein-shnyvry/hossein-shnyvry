<svg fill="none" width="600" height="280" viewBox="0 0 600 280" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* استایل‌های تم تاریک (پیش‌فرض گیت‌هاب) */
    .box { stroke: #FFFFFF; stroke-width: 3; fill: none; }
    .abbr { font: 900 32px 'Segoe UI', -apple-system, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .label { font: 700 13px 'Segoe UI', -apple-system, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .star-filled { fill: #D69E2E; font-size: 13px; }
    .star-empty { fill: #4A5568; font-size: 13px; }
    .bg-gap { fill: #0D1117; } /* پس‌زمینه گیت‌هاب برای قطع کردن خط پایین */

    /* تنظیمات خودکار برای تم روشن (Light Mode) */
    @media (prefers-color-scheme: light) {
      .box { stroke: #000000; }
      .abbr { fill: #000000; }
      .label { fill: #000000; }
      .star-empty { fill: #CBD5E1; }
      .bg-gap { fill: #FFFFFF; }
    }
  </style>

  <!-- ================= سطر اول ================= -->

  <!-- ۱. Next.js (NX) -->
  <g transform="translate(20, 10)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">NX</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★★</tspan>
    </text>
    <text x="50" y="125" class="label">Next.js</text>
  </g>

  <!-- ۲. Node.js (NJ) -->
  <g transform="translate(150, 10)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">NJ</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="50" y="125" class="label">Node.js</text>
  </g>

  <!-- ۳. React / RN (RE) -->
  <g transform="translate(280, 10)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">RE</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★★</tspan>
    </text>
    <text x="50" y="125" class="label">React / RN</text>
  </g>

  <!-- ۴. TypeScript (TS) -->
  <g transform="translate(410, 10)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">TS</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="50" y="125" class="label">TypeScript</text>
  </g>


  <!-- ================= سطر دوم ================= -->

  <!-- ۵. PostgreSQL (PG) -->
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">PG</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="50" y="125" class="label">PostgreSQL</text>
  </g>

  <!-- ۶. Python (PY) -->
  <g transform="translate(150, 150)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">PY</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★</tspan><tspan class="star-empty">★★</tspan>
    </text>
    <text x="50" y="125" class="label">Python</text>
  </g>

  <!-- ۷. AI / LLM (AI) -->
  <g transform="translate(280, 150)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">AI</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="50" y="125" class="label">AI &amp; LLMs</text>
  </g>

  <!-- ۸. Linux / Git (LX) -->
  <g transform="translate(410, 150)">
    <rect x="0" y="0" width="100" height="100" class="box" />
    <text x="50" y="62" class="abbr">LX</text>
    <rect x="15" y="96" width="70" height="8" class="bg-gap" />
    <text x="50" y="103" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="50" y="125" class="label">Linux &amp; Git</text>
  </g>
</svg>
