<svg fill="none" width="980" height="130" viewBox="0 0 980 130" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* استایل‌های تم تاریک (پیش‌فرض گیت‌هاب) */
    .box { stroke: #30363D; stroke-width: 2; fill: none; }
    .abbr { font: 800 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #FFFFFF; text-anchor: middle; }
    .label { font: 700 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #C9D1D9; text-anchor: middle; }
    .star-filled { fill: #D69E2E; font-size: 11px; }
    .star-empty { fill: #30363D; font-size: 11px; }
    .bg-gap { fill: #0D1117; } /* پوشش برای بریدگی پایین کادر */

    /* تنظیمات خودکار برای تم روشن (Light Mode) */
    @media (prefers-color-scheme: light) {
      .box { stroke: #D0D7DE; }
      .abbr { fill: #1F2328; }
      .label { fill: #24292F; }
      .star-empty { fill: #D0D7DE; }
      .bg-gap { fill: #FFFFFF; }
    }
  </style>

  <!-- تک ردیف: ۸ کارت مهارت متناسب با عرض کل صفحه -->

  <!-- ۱. Next.js (NX) -->
  <g transform="translate(10, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">NX</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★★</tspan>
    </text>
    <text x="40" y="102" class="label">Next.js</text>
  </g>

  <!-- ۲. Node.js (NJ) -->
  <g transform="translate(131, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">NJ</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="40" y="102" class="label">Node.js</text>
  </g>

  <!-- ۳. React / RN (RE) -->
  <g transform="translate(252, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">RE</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★★</tspan>
    </text>
    <text x="40" y="102" class="label">React / RN</text>
  </g>

  <!-- ۴. TypeScript (TS) -->
  <g transform="translate(373, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">TS</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="40" y="102" class="label">TypeScript</text>
  </g>

  <!-- ۵. PostgreSQL (PG) -->
  <g transform="translate(494, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">PG</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="40" y="102" class="label">PostgreSQL</text>
  </g>

  <!-- ۶. Python (PY) -->
  <g transform="translate(615, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">PY</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★</tspan><tspan class="star-empty">★★</tspan>
    </text>
    <text x="40" y="102" class="label">Python</text>
  </g>

  <!-- ۷. AI / LLM (AI) -->
  <g transform="translate(736, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">AI</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="40" y="102" class="label">AI &amp; LLMs</text>
  </g>

  <!-- ۸. Linux / Git (LX) -->
  <g transform="translate(857, 5)">
    <rect x="0" y="0" width="80" height="80" rx="4" class="box" />
    <text x="40" y="49" class="abbr">LX</text>
    <rect x="8" y="76" width="64" height="8" class="bg-gap" />
    <text x="40" y="83" text-anchor="middle">
      <tspan class="star-filled">★★★★</tspan><tspan class="star-empty">★</tspan>
    </text>
    <text x="40" y="102" class="label">Linux &amp; Git</text>
  </g>
</svg>
